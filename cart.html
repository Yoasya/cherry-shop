<html>
<head>
    <title>CHERRY?</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1 class="header_main_text">CHERRY?</h1>
        <nav class="menu">
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="SourCherry.html">Вишня</a>
            <a href="SweetCherry.html">Черешня</a>
            <a href="cart.html" id="cartLink">Корзина (<span id="cartCount">0</span>)</a>
            <a href="info.html">О нас</a>
        </nav>
        <img src="pics/theme.png" alt="theme" id="themeToggle" />
    </header>

    <main class="page">
        <div class="catalog">
            <p class="main_text_catalog">Корзина</p>
            <a href="catalog.html" class="catalog_href"> < В каталог</a>
        </div>

        <div id="cartContent" class="table_cart"></div>

        <script>

            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            function renderCart() {
                const content = document.getElementById('cartContent');

                if (cart.length === 0) {
                    content.innerHTML = '<div class="empty">Корзина пустая</div>';
                    return;
                }

                const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

                let html = `
                                <table >
                                    <thead>
                                        <tr>
                                            <th>Товар</th>
                                            <th>Тип</th>
                                            <th>Цена</th>
                                            <th>Количество</th>
                                            <th>Сумма</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                <tbody>
                                `;
                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.quantity;
                    html += `<tr>
                                <td data-label="Товар">${item.name}</td>
                                <td data-label="Тип">${item.type}</td>
                                <td data-label="Цена">${item.price?.toLocaleString()}₽</td>
                                <td data-label="Кол-во">
                                    <div class="quantity-control">
                                        <button class="plus" onclick="deceraseQuantity(${index})">-</button>
                                        <input type="number" class="kolvo" value="${item.quantity}" min="1" onchange="updateQuantity(${index}, this.value)">
                                        <button class="plus" onclick="increaseQuantity(${index})">+</button>
                                    </div>
                                </td>
                                <td data-label="Сумма">${itemTotal.toLocaleString()}₽</td>
                                <td><button class="delite" onclick="removeItem(${index})">Удалить</button></td>
                            </tr>
                                    `;
                });

                html += `
                                </tbody>
                                </table>
                                <div class="total">Итого: ${total.toLocaleString()}₽</div>
                                `;

                content.innerHTML = html;
            }

            function increaseQuantity(index) {
                cart[index].quantity++;
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }

            function deceraseQuantity(index) {
                if (cart[index].quantity > 1) {
                    cart[index].quantity--;
                    localStorage.setItem('cart', JSON.stringify(cart));
                    renderCart();
                }
            }

            function updateQuantity(index, value) {
                const newQuantity = parseInt(value, 10);
                if (newQuantity >= 1) {
                    cart[index].quantity = newQuantity;
                    localStorage.setItem('cart', JSON.stringify(cart));
                    renderCart();
                }
            }

            function removeItem(index) {
                cart.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }

            document.addEventListener('DOMContentLoaded', renderCart);

            //смена темы
            document.addEventListener('DOMContentLoaded', function () {
                const themeToggle = document.getElementById('themeToggle');

                const savedTheme = localStorage.getItem('siteTheme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                if (savedTheme === 'dark') {
                    document.body.classList.add('dark-theme');
                } else if (savedTheme === 'light') {
                    document.body.classList.remove('dark-theme');
                } else if (systemDark) {
                    document.body.classList.add('dark-theme');
                    localStorage.setItem('siteTheme', 'dark')
                }

                themeToggle.addEventListener('click', function () {
                    if (document.body.classList.contains('dark-theme')) {
                        document.body.classList.remove('dark-theme');
                        localStorage.setItem('siteTheme', 'light');
                    } else {
                        document.body.classList.add('dark-theme');
                        localStorage.setItem('siteTheme', 'dark');
                    }
                });
            });

            document.addEventListener('DOMContentLoaded', () => {
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                const cartCountElement = document.getElementById('cartCount');

                if (cartCountElement) {
                    cartCountElement.textContent = cart.length;
                }
            });

        </script>

        <div class="background_layer">
            <p class="background_text">BLOSSOM</p>
        </div>
    </main>

        <footer>
            <p>© 2025 Все права не защищены. Запомните, носки пропадают не просто так, это маркетинг параллельной вселенной.</p>
        </footer>
</body>
</html>
