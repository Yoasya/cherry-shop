<html>
<head>
    <title>CHERRY?</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1 class="header_main_text">CHERRY?</h1>
        <nav class="menu">
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="SourCherry.html">Вишня</a>
            <a href="SweetCherry.html">Черешня</a>
            <a href="cart.html" id="cartLink">Корзина (<span id="cartCount">0</span>)</a>
            <a href="info.html">О нас</a>
        </nav>
        <img src="pics/theme.png" alt="theme" id="themeToggle" />
    </header>

    <main class="page">
        <div class="catalog">
            <p class="main_text_catalog">Каталог</p>
            <a href="SourCherry.html">Вишня</a>
            <a href="SweetCherry.html">Черешня</a>
        </div>

        <div class="products_location">
            <div class="products" id="products"></div>
        </div>

        <script>

            const products = [
                { id: 1, name: 'Аморелль', price: 600, type: 'Вишня', image: 'pics/amarelle.webp' },
                { id: 2, name: 'Живица', price: 400, type: 'Вишня', image: 'pics/jivitsa.jpg' },
                { id: 3, name: 'Медуница', price: 700, type: 'Черешня', image: 'pics/medunitsa.jpg' },
                { id: 4, name: 'Звездочка', price: 400, type: 'Вишня', image: 'pics/zvezdochka.jpg' },
                { id: 5, name: 'Ревна', price: 800, type: 'Черешня', image: 'pics/revna.jpg' },
            ];

            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            function updateCartCount() {
                document.getElementById('cartCount').textContent = cart.length;
            }

            function addToCart(productId) {
                const product = products.find(p => p.id === productId);
                if (product) {
                    cart.push({ ...product, quantity: 1 });
                    localStorage.setItem('cart', JSON.stringify(cart));
                    updateCartCount();
                }
            }

            function renderProducts() {
                const container = document.getElementById('products');
                container.innerHTML = '';
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product';
                    card.innerHTML = `
                        <img src="${product.image}" alt="${product.name}" class="product-image">
                        <a href="amarelle.html?id=${product.id}">${product.name}</a>
                        <p>${product.type}</p>
                        <p class="price">${product.price.toLocaleString()}₽</p>
                        <button class="btn" onclick="addToCart(${product.id})">В корзину</button>
                    `;
                    container.appendChild(card);
                });
            }

            document.addEventListener('DOMContentLoaded', () => {
                renderProducts();
                updateCartCount();
            });

            //смена темы
            document.addEventListener('DOMContentLoaded', function () {
                const themeToggle = document.getElementById('themeToggle');

                const savedTheme = localStorage.getItem('siteTheme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                if (savedTheme === 'dark') {
                    document.body.classList.add('dark-theme');
                } else if (savedTheme === 'light') {
                    document.body.classList.remove('dark-theme');
                } else if (systemDark) {
                    document.body.classList.add('dark-theme');
                    localStorage.setItem('siteTheme', 'dark')
                }

                themeToggle.addEventListener('click', function () {
                    if (document.body.classList.contains('dark-theme')) {
                        document.body.classList.remove('dark-theme');
                        localStorage.setItem('siteTheme', 'light');
                    } else {
                        document.body.classList.add('dark-theme');
                        localStorage.setItem('siteTheme', 'dark');
                    }
                });
            });

        </script>

            <div class="background_layer">
                <p class="background_text">BLOSSOM</p>
            </div>
        </main>
            <footer>
                <p>© 2025 Все права не защищены. Запомните, носки пропадают не просто так, это маркетинг параллельной вселенной.</p>
            </footer>
    </body>
    </html>
